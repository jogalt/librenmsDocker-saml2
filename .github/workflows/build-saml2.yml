name: build-saml2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile.saml2
      - .github/workflows/build-saml2.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push SAML2 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.saml2
          pull: true
          push: true
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64
            linux/ppc64le
            linux/s390x
          tags: jogaltanon/librenms-saml2:latest
          cache-from: type=gha,scope=librenms-saml2
          cache-to: type=gha,mode=max,scope=librenms-saml2
