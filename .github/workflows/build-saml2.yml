name: build-saml2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - '.saml2/**'
      - '.github/workflows/build-saml2.yml'
      - 'Dockerfile'
      - 'docker-bake.hcl'
      - 'rootfs/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}

      # Patch only the runner workspace. The tracked Dockerfile remains an exact
      # upstream file so sync-upstream can merge it normally.
      - name: Inject SAML2 provider into upstream Dockerfile
        run: |
          set -euo pipefail
          python3 .saml2/prepare-dockerfile.py
          grep -n -A3 -B2 'socialiteproviders/saml2' Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Use upstream's image-all target instead of maintaining our own platform
      # list. This automatically follows platform changes in docker-bake.hcl.
      - name: Build and push upstream multi-arch SAML2 image
        uses: docker/bake-action@v7
        with:
          source: .
          targets: image-all
          pull: true
          push: true
          provenance: mode=max
          set: |
            image-all.tags=jogaltanon/librenms-saml2:latest
            image-all.cache-from=type=gha,scope=librenms-saml2
            image-all.cache-to=type=gha,mode=max,scope=librenms-saml2
